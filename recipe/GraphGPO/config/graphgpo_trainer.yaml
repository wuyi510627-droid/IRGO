hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  gen_batch_size: ${data.train_batch_size}

reward_model:
  reward_manager: episode
  overlong_buffer:
    enable: False
    len: 0
    penalty_factor: 0.0
    log: False

algorithm:
  adv_estimator: graphgpo
  gamma: 0.10  # small gamma suited for graph-distance-based returns
  graphgpo:
    step_advantage_w: 1.0
    episode_advantage_w: 1.0
    mode: "mean_std_norm"  # "mean_norm" or "mean_std_norm"
    enable_similarity: False  # whether to merge similar observations into one graph node
    similarity_thresh: 0.95   # similarity threshold (0.0, 1.0), used when enable_similarity=True
    normalize_distance: False  # if True, use distance delta instead of absolute distance
  prob:
    horizon: 8
  u:
    enabled: false
    policy_evidence: natural_and_unforced_continuations_v2
    environment_version: REQUIRED
    horizon: 8
    min_count: 2
    sign_threshold: 0.95
    practical_epsilon: 0.02
    posterior_draws: 512
    max_probes: 16
    max_probes_per_task: 2
    max_extra_env_calls: 240
    seed: 20260927
    history_rounds: 10
    history_max_trajectories: 1280
  filter_groups:
    enable: False
    metric: null
    max_num_gen_batches: 0

env:
  webshop:
    observation_mode: text_rich

trainer:
  project_name: verl-graphgpo
  val_out: False
  val_only: False
  test_only: False

name: IRGO CPU contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'torch>=2.6,<2.7' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/test.txt
      - name: Run algorithm and release contracts
        run: python -m pytest tests/irgo -q
      - name: Check Python syntax
        run: python -m compileall -q recipe/GraphGPO scripts/irgo verl agent_system

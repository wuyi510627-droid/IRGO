# IRGO: archived 150-round settings; only paths and display names parameterized.
actor_rollout_ref:
  actor:
    checkpoint:
      contents:
      - model
      - optimizer
      - extra
    clip_ratio: 0.2
    clip_ratio_c: 3.0
    clip_ratio_high: 0.2
    clip_ratio_low: 0.2
    entropy_coeff: 0.001
    fsdp_config:
      fsdp_size: -1
      offload_policy: false
      optimizer_offload: false
      param_offload: false
      reshard_after_forward: true
      wrap_policy:
        min_num_params: 0
    grad_clip: 1.0
    invalid_action_penalty_coef: 0.1
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    loss_agg_mode: token-mean
    optim:
      lr: 1.0e-06
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: 0.0
      num_cycles: 0.5
      total_training_steps: -1
      warmup_style: constant
      weight_decay: 0.01
    policy_loss:
      loss_mode: vanilla
    ppo_epochs: 1
    ppo_max_token_len_per_gpu: 16384
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 64
    shuffle: false
    strategy: fsdp
    ulysses_sequence_parallel_size: 1
    use_dynamic_bsz: false
    use_invalid_action_penalty: true
    use_kl_loss: true
    use_torch_compile: false
  hybrid_engine: true
  model:
    enable_activation_offload: false
    enable_gradient_checkpointing: true
    external_lib: null
    lora_alpha: 16
    lora_rank: 0
    override_config: {}
    path: ${oc.env:IRGO_MODEL_PATH}
    target_modules: all-linear
    trust_remote_code: false
    use_fused_kernels: false
    use_liger: false
    use_remove_padding: true
    use_shm: false
  ref:
    fsdp_config:
      param_offload: true
      reshard_after_forward: true
      wrap_policy:
        min_num_params: 0
    log_prob_max_token_len_per_gpu: 16384
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 2
    log_prob_use_dynamic_bsz: false
    strategy: fsdp
    ulysses_sequence_parallel_size: 1
    use_torch_compile: false
  rollout:
    chat_scheduler: null
    disable_log_stats: true
    do_sample: true
    dtype: bfloat16
    enable_chunked_prefill: false
    enforce_eager: true
    engine_kwargs:
      sglang:
        attention_backend: null
      vllm:
        swap_space: 0
    free_cache_engine: true
    gpu_memory_utilization: 0.35
    ignore_eos: false
    layered_summon: false
    load_format: dummy_dtensor
    log_prob_max_token_len_per_gpu: 16384
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 2
    log_prob_use_dynamic_bsz: false
    max_model_len: null
    max_num_batched_tokens: 8192
    max_num_seqs: 16
    mode: sync
    multi_turn:
      enable: false
      format: chatml
      max_turns: null
      tool_config_path: null
    n: 1
    name: vllm
    prompt_length: 5120
    response_length: 512
    temperature: 1.0
    tensor_model_parallel_size: 2
    top_k: -1
    top_p: 1
    use_fire_sampling: false
    val_kwargs:
      do_sample: true
      n: 1
      temperature: 0.4
      top_k: -1
      top_p: 1.0
algorithm:
  adv_estimator: prob
  filter_groups:
    enable: false
    max_num_gen_batches: 0
    metric: null
  gamma: 0.2
  gigpo:
    enable_similarity: false
    mode: mean_norm
    similarity_thresh: 0.95
    step_advantage_w: 1.0
  graphgpo:
    enable_similarity: false
    episode_advantage_w: 1.0
    mode: mean_std_norm
    normalize_distance: false
    similarity_thresh: 0.95
    step_advantage_w: 1.0
  kl_ctrl:
    horizon: 10000
    kl_coef: 0.001
    target_kl: 0.1
    type: fixed
  kl_penalty: kl
  lam: 1.0
  norm_adv_by_std_in_grpo: true
  pf_ppo:
    reweight_method: pow
    weight_pow: 2.0
  use_kl_in_reward: false
  use_pf_ppo: false
  prob:
    horizon: 8
  u:
    enabled: true
    environment_version: webshop-1k-30a4765c3a327af7-f88a36314a397b53
    horizon: 8
    min_count: 2
    sign_threshold: 0.95
    practical_epsilon: 0.02
    posterior_draws: 512
    max_probes: 32
    max_probes_per_task: 4
    max_extra_env_calls: 480
    seed: 20260927
    history_rounds: 10
    history_max_trajectories: 1280
    policy_evidence: natural_and_unforced_continuations_v2
    credit_state_mode: page
    auxiliary_enabled: true
    auxiliary_coefficient: 0.1
